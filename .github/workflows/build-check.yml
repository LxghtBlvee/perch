name: Build Check

on:
  pull_request:
    branches: [live]

jobs:
  build-hub:
    name: Build hub image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build hub (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/hub/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-agent:
    name: Build agent image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build agent (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/agent/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
