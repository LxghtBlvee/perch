name: Stale

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been inactive for 30 days and will be closed in 7 days if there's no new activity.
          stale-pr-message: >
            This PR has been inactive for 30 days and will be closed in 7 days if there's no new activity.
          close-issue-message: Closed due to inactivity. Feel free to reopen if still relevant.
          close-pr-message: Closed due to inactivity. Feel free to reopen if still relevant.
          exempt-issue-labels: 'pinned,security,bug'
          exempt-pr-labels: 'pinned,security'