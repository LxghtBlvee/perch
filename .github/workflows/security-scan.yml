name: Security Scan

on:
  push:
    tags:
      - 'v*'

jobs:
  scan-hub:
    name: Scan hub image
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on hub image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lxghtblvee/perch-hub:latest
          format: sarif
          output: trivy-hub.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload hub results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-hub.sarif
          category: trivy-hub

  scan-agent:
    name: Scan agent image
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on agent image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lxghtblvee/perch-agent:latest
          format: sarif
          output: trivy-agent.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload agent results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-agent.sarif
          category: trivy-agent
