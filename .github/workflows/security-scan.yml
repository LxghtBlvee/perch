name: Security Scan

on:
  push:
    tags:
      - 'v*'

jobs:
  scan-hub:
    name: Scan hub image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run Trivy on hub image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lxghtblvee/perch-hub:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

  scan-agent:
    name: Scan agent image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run Trivy on agent image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lxghtblvee/perch-agent:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
