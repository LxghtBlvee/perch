<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Cylinder body -->
  <rect x="10" y="20" width="44" height="28" rx="4" fill="#a855f7" opacity="0.15"/>
  <rect x="10" y="20" width="44" height="28" rx="4" stroke="#a855f7" stroke-width="2.5"/>

  <!-- Top ellipse (lid) -->
  <ellipse cx="32" cy="20" rx="22" ry="7" fill="#a855f7" opacity="0.25"/>
  <ellipse cx="32" cy="20" rx="22" ry="7" stroke="#a855f7" stroke-width="2.5"/>

  <!-- Stack lines inside body -->
  <line x1="10" y1="31" x2="54" y2="31" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>
  <line x1="10" y1="40" x2="54" y2="40" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>

  <!-- Highlight arc on top ellipse -->
  <path d="M 18 18 Q 32 13 46 18" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
